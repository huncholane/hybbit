# Local copy of the production data stores, for checking the Rust backend against
# the Node one on identical data. Nothing persists: bring it up, then load a snapshot
# with ./restore-snapshot.sh ../../backups/<timestamp>.
name: hygo-parity

services:
  postgres:
    image: postgres:17.4
    environment:
      POSTGRES_USER: hygo
      POSTGRES_PASSWORD: hygo
      POSTGRES_DB: analytics
    ports: ["127.0.0.1:55432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hygo -d analytics"]
      interval: 2s
      retries: 30

  clickhouse:
    image: clickhouse/clickhouse-server:26.3.17.4
    environment:
      CLICKHOUSE_DB: analytics
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: hygo
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports: ["127.0.0.1:58123:8123"]
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      test: ["CMD", "clickhouse-client", "--password", "hygo", "-q", "SELECT 1"]
      interval: 2s
      retries: 30

  redis:
    image: redis:8.6.4-alpine
    command: ["redis-server", "--requirepass", "hygo"]
    ports: ["127.0.0.1:56379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "hygo", "--no-auth-warning", "ping"]
      interval: 2s
      retries: 30
